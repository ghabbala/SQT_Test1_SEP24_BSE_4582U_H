# CI pipeline: installs dependencies and runs the TicketHub suite on every push.
name: tickethub-qa

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Verify system under test is unchanged
        run: echo "71e842b280aaf5b8d75d826abef0b364b2802f491a1c20cf2056d170f722c4a3  src/tickethub.py" | sha256sum -c -

      # Evidence step: raw run that ignores xfail markers, so every defect shows
      # as a failure in the log and in junit_report_raw.xml. Allowed to fail.
      - name: Raw run (defects visible)
        continue-on-error: true
        run: python -m pytest -v --runxfail --junitxml=ci/junit_report_raw.xml

      # Gate step: known defects are strict xfail tied to DEF-IDs. Goes red on any
      # new failure, or when a logged defect is fixed (XPASS(strict)).
      - name: Gated run
        run: python -m pytest -v --junitxml=ci/junit_report.xml

      - name: Publish test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-reports-py${{ matrix.python-version }}
          path: ci/junit_report*.xml
